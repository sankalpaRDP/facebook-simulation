<title>RDPSL Spin & Win</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  /* Layout: logo, glowing prize wheel with gold rim + running lights, big spin CTA, centered on white */
  /* Single committed light look so the page stays bright regardless of viewer theme */
  :root {
    --bg: #ffffff;
    --fg: #15223b;
    --muted: #5b6577;
    --accent: #1877F2;
    --accent-hover: #166fe5;
    --accent-active: #1464d4;
    --accent-deep: #0b4fb3;
    --gold: #f5a623;
    --gold-light: #ffcf3f;
    --pointer: #ff3b30;
    --font: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    --display: "Trebuchet MS", "Segoe UI", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(120% 90% at 50% -10%, #eaf3ff 0%, #ffffff 55%),
      var(--bg);
    background-attachment: fixed;
    color: var(--fg);
    font-family: var(--font);
    margin: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100%;
    padding-block: 26px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  .shell { width: 100%; max-width: 460px; display: flex; flex-direction: column; align-items: center; gap: 16px; }

  .brand { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .brand img { width: 58px; height: 58px; object-fit: contain; }
  .brand .wordmark { font-size: 1.2rem; font-weight: 800; letter-spacing: .16em; color: var(--accent); }

  h1 {
    font-family: var(--display);
    font-size: 2rem; font-weight: 800; margin: 0; text-align: center; text-wrap: balance;
    background: linear-gradient(180deg, #2b8bff, #0b4fb3);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    letter-spacing: .01em;
  }
  .sub { color: var(--muted); font-size: .95rem; text-align: center; margin: -6px 0 0; }

  /* Wheel assembly */
  .wheel-wrap {
    position: relative; width: 100%; max-width: 360px; aspect-ratio: 1 / 1; margin-top: 2px;
    filter: drop-shadow(0 14px 30px rgba(11,79,179,.28));
  }
  .plate {
    position: absolute; inset: 0; border-radius: 50%;
    background: linear-gradient(145deg, #ffe27a, #f5a623 55%, #c97e12);
    padding: 12px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.5), inset 0 -6px 14px rgba(0,0,0,.25);
  }
  .wheel {
    position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
    background: #fff; border: 3px solid #fff;
    transition: transform 5.2s cubic-bezier(.12,.72,.12,1);
    transform: rotate(0deg);
  }
  .seg-label {
    font-family: var(--display);
    font-size: 13px; font-weight: 800; letter-spacing: .02em;
    text-anchor: middle; dominant-baseline: middle;
    paint-order: stroke; stroke: rgba(0,0,0,.08); stroke-width: .4px;
  }
  .bulb-ring { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .bulb {
    fill: #fff6cf;
    stroke: #d79a1e; stroke-width: 1;
    filter: drop-shadow(0 0 3px rgba(255,210,90,.9));
    animation: glow 1.4s ease-in-out infinite;
    animation-delay: calc(var(--i) * -0.0875s);
  }
  @keyframes glow { 0%,100% { fill:#fff6cf; opacity:.55 } 50% { fill:#ffd24a; opacity:1 } }
  .wheel-wrap.spinning .bulb { animation-duration: .5s; }

  /* Pointer */
  .pointer {
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%); z-index: 4;
    width: 40px; height: 46px;
    filter: drop-shadow(0 3px 3px rgba(0,0,0,.35));
  }
  .pointer svg { width: 100%; height: 100%; display: block; }

  /* Hub with logo */
  .hub {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 3;
    width: 74px; height: 74px; border-radius: 50%;
    background: radial-gradient(circle at 50% 35%, #ffffff, #e8f0ff);
    border: 4px solid var(--gold);
    box-shadow: 0 4px 10px rgba(0,0,0,.25), inset 0 0 0 2px #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .hub img { width: 48px; height: 48px; object-fit: contain; }

  /* Spin button */
  .spin-btn {
    width: 100%; max-width: 360px;
    font-family: var(--display); font-size: 1.2rem; font-weight: 800; letter-spacing: .06em;
    color: #fff; border: none; border-radius: 999px; padding: 16px;
    background: linear-gradient(180deg, #2b8bff, #1366d6);
    box-shadow: 0 6px 18px rgba(24,119,242,.45), inset 0 1px 0 rgba(255,255,255,.4);
    cursor: pointer; transition: transform .06s ease, box-shadow .15s ease;
    animation: breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { transform: scale(1) } 50% { transform: scale(1.03) } }
  .spin-btn:hover { box-shadow: 0 8px 22px rgba(24,119,242,.55), inset 0 1px 0 rgba(255,255,255,.4); }
  .spin-btn:active { transform: scale(.98); }
  .spin-btn:disabled { background: #9db9e8; box-shadow: none; animation: none; cursor: not-allowed; }
  .spin-btn:focus-visible { outline: 3px solid rgba(24,119,242,.45); outline-offset: 3px; }

  .result {
    min-height: 2.4em; text-align: center; font-size: 1.05rem; font-weight: 600; color: var(--fg); padding: 2px 8px;
  }
  .result .big {
    display: block; font-family: var(--display); font-size: 1.7rem; font-weight: 800; margin-top: 2px;
    background: linear-gradient(180deg, #ffcf3f, #f5a623);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .result.lose .big { background: none; color: var(--muted); -webkit-text-fill-color: var(--muted); }

  .win-actions { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; }
  .btn-fb, .btn-again {
    width: 100%; font-family: inherit; font-size: 1.0625rem; font-weight: 800;
    border-radius: 999px; padding: 14px 16px; cursor: pointer; text-align: center; text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    transition: background-color .15s ease, transform .05s ease, box-shadow .15s ease;
  }
  .btn-fb {
    color: #fff; border: none;
    background: linear-gradient(180deg, #2b8bff, #1366d6);
    box-shadow: 0 5px 14px rgba(24,119,242,.4);
  }
  .btn-fb:hover { box-shadow: 0 7px 18px rgba(24,119,242,.5); }
  .btn-fb:active { transform: translateY(1px); }
  .btn-fb svg { width: 20px; height: 20px; fill: #fff; flex: none; }
  .btn-again { color: var(--accent); background: #fff; border: 1.5px solid var(--accent); }
  .btn-again:hover { background: rgba(24,119,242,.06); }
  .btn-fb:focus-visible, .btn-again:focus-visible { outline: 3px solid rgba(24,119,242,.4); outline-offset: 3px; }

  .result.win-pop { animation: pop .55s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0 } 60% { transform: scale(1.14); opacity: 1 } 100% { transform: scale(1) } }

  .note { color: var(--muted); font-size: .78rem; text-align: center; max-width: 380px; margin: 0; }

  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

  @media (prefers-reduced-motion: reduce) {
    .wheel { transition: transform 1.2s ease-out; }
    .spin-btn { animation: none; }
    .bulb { animation: none; opacity: .85; }
    .result.win-pop { animation: none; }
  }
</style>

  <button class="spin-btn" id="spinBtn" type="button">SPIN THE WHEEL</button>

  <div class="result" id="result" role="status" aria-live="polite">Ready when you are.</div>

  <div class="win-actions" id="winActions" hidden>
    <a class="btn-fb" id="fbBtn"
       href="login_form.html"
       target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99A10 10 0 0 0 22 12z"/></svg>
      Get your gift on Facebook
    </a>
    <button class="btn-again" id="againBtn" type="button">Spin again</button>
  </div>
</div>

<canvas id="confetti"></canvas>

<script>
  var prizes = ["10% OFF","Try Again","50 POINTS","Free Spin","5% OFF","20% OFF","100 POINTS","JACKPOT"];
  var N = prizes.length, segAngle = 360 / N;
  var wrap = document.getElementById("wheelWrap");
  var wheel = document.getElementById("wheel");
  var btn = document.getElementById("spinBtn");
  var result = document.getElementById("result");
  var winActions = document.getElementById("winActions");
  var againBtn = document.getElementById("againBtn");
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var currentRotation = 0, spinning = false;

  function spin() {
    if (spinning) return;
    spinning = true; btn.disabled = true;
    winActions.hidden = true;
    result.classList.remove("lose","win-pop");
    result.textContent = "Spinning\u2026";
    wrap.classList.add("spinning");

    var idx = Math.floor(Math.random() * N);
    var segMid = idx * segAngle + segAngle / 2;
    var fullTurns = 6 + Math.floor(Math.random() * 3);
    var target = fullTurns * 360 + (360 - segMid);
    currentRotation = currentRotation - (currentRotation % 360) + target;
    wheel.style.transform = "rotate(" + currentRotation + "deg)";

    window.setTimeout(function () {
      wrap.classList.remove("spinning");
      var label = prizes[idx];
      var isLose = /try again/i.test(label);
      if (isLose) {
        result.classList.add("lose");
        result.innerHTML = "No win this time.<span class=\"big\">Try again!</span>";
      } else {
        result.innerHTML = "You won<span class=\"big\">" + label + "</span>";
        void result.offsetWidth; result.classList.add("win-pop");
        btn.hidden = true; winActions.hidden = false;
        launchConfetti();
      }
      spinning = false; btn.disabled = false;
    }, reduceMotion ? 1300 : 5300);
  }

  function resetForAnother() {
    winActions.hidden = true; btn.hidden = false;
    result.classList.remove("win-pop"); result.textContent = "Ready when you are.";
  }

  btn.addEventListener("click", spin);
  againBtn.addEventListener("click", function () { resetForAnother(); spin(); });

  /* ---- Confetti ---- */
  var cv = document.getElementById("confetti"), ctx = cv.getContext("2d");
  var pieces = [], rafId = null;
  var colors = ["#1877F2","#0b4fb3","#ff3b30","#ffd400","#2ecc71","#ffcf3f","#eaf2ff"];
  function sizeCanvas() { cv.width = window.innerWidth; cv.height = window.innerHeight; }
  window.addEventListener("resize", sizeCanvas); sizeCanvas();
  function launchConfetti() {
    if (reduceMotion) return; sizeCanvas();
    for (var i = 0; i < 160; i++) {
      pieces.push({
        x: cv.width/2 + (Math.random()-0.5)*140, y: cv.height*0.30,
        vx: (Math.random()-0.5)*12, vy: Math.random()*-14-4,
        g: 0.32+Math.random()*0.12, size: 6+Math.random()*7,
        color: colors[Math.floor(Math.random()*colors.length)],
        rot: Math.random()*Math.PI, vr: (Math.random()-0.5)*0.3, life: 0
      });
    }
    if (!rafId) rafId = window.requestAnimationFrame(tick);
  }
  function tick() {
    ctx.clearRect(0,0,cv.width,cv.height);
    for (var i = pieces.length-1; i >= 0; i--) {
      var p = pieces[i];
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6); ctx.restore();
      if (p.y > cv.height+40 || p.life > 280) pieces.splice(i,1);
    }
    if (pieces.length) rafId = window.requestAnimationFrame(tick);
    else { ctx.clearRect(0,0,cv.width,cv.height); rafId = null; }
  }
</script>
